name: Update contribution graph

on:
  schedule:
    - cron: '17 21 * * *' # daily, 05:17 Asia/Manila
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build graphs from the public contribution calendar
        run: node .github/scripts/contribution-graph.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-light.svg assets/contributions-dark.svg
          git diff --cached --quiet || git commit -m "Update contribution graph"
          git push
